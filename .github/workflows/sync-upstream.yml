name: Sync Upstream

on:
  schedule:
    - cron: '0 2 * * *'        # 每天 UTC 02:00 = 北京时间 10:00
  workflow_dispatch:            # 允许在 Actions 页面手动触发

permissions:
  contents: write              # GITHUB_TOKEN 仅 contents 写权限即可；workflow 文件不在其能力范围

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        # ↓↓↓ 务必把「上游所有者/上游仓库名」换成真实地址，例如 octocat/hello-world
        run: git remote add upstream https://github.com/OwO-Network/DLX

      - name: Show remotes (debug, 确认后可删)
        run: git remote -v

      - name: Fetch upstream
        run: git fetch upstream

      - name: Show upstream branches (debug, 确认后可删)
        run: git branch -r

      - name: Checkout default branch
        run: git checkout main     # 若你的 fork 默认分支是 master，改这里

      - name: Merge upstream
        run: |
          UPSTREAM_BRANCH=$(git ls-remote --symref upstream HEAD | grep '^ref:' | sed 's@.*/heads/@@; s@\t.*@@')
          echo "Upstream default branch: $UPSTREAM_BRANCH"
          git merge "upstream/$UPSTREAM_BRANCH" --no-ff -m "chore: merge upstream/$UPSTREAM_BRANCH"

      - name: Exclude upstream workflow files
        # GITHUB_TOKEN 无法推送对 .github/workflows 的改动，
        # 因此若上游改了 workflow 文件，将其还原为 fork 自身原有状态，只同步代码与其他文件
        run: |
          if git diff --name-only origin/main HEAD | grep -qF '.github/workflows/'; then
            echo "Upstream changed workflow files; restoring fork's own .github/workflows"
            git checkout origin/main -- .github/workflows
            git add -A
            git commit --amend --no-edit
          else
            echo "No upstream workflow changes; nothing to exclude"
          fi

      - name: Push to fork
        run: git push origin main    # 与上面 checkout 的分支保持一致
