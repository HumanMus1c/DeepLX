name: Sync Script

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 签出代码，fetch-depth: 0 表示拉取完整的提交历史，便于合并
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 你的个人访问令牌，确保有推送权限
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 添加上游仓库
      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/OwO-Network/DeepLX.git
          git fetch upstream

      # 3. 合并上游更改 (假设你的主分支是 main)
      - name: Merge upstream changes
        run: |
          git checkout main
          git merge upstream/main --no-edit

      # 4. 推送更新到你的远程仓库 (origin)
      - name: Push changes to fork
        run: |
          git push origin main

      # 5. Committer identity 设置推送身份
      - name: Merge upstream (keep fork history)
        run: git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" merge upstream/main --no-ff -m "chore: merge upstream/main"

